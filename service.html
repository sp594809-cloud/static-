<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Service Details | Koshti & Company</title>
  <meta name="description" content="Factual service details, document requirements, and process roadmap." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Shared Header -->
  <div id="site-header"></div>

  <!-- Banner -->
  <section style="background: var(--primary); color: #fff; padding: 3rem 0;">
    <div class="container">
      <a href="services.html" style="color: var(--accent); font-size: 0.9rem; font-weight: 500; display: inline-flex; align-items: center; gap: 0.3rem; margin-bottom: 0.75rem;">
        &larr; Back to Services List
      </a>
      <span class="badge-tag" id="srv-category-badge" style="background: rgba(255,255,255,0.15); color: #fff; display: block; width: max-content; margin-bottom: 0.5rem;">Category</span>
      <h1 id="srv-title" style="color: #fff; margin-bottom: 0.5rem;">Service Details</h1>
    </div>
  </section>

  <!-- Service Detail Body -->
  <section class="section">
    <div class="container">
      <div style="max-width: 850px; margin: 0 auto;" id="service-detail-container">
        <!-- Content dynamically injected -->
        <p style="text-align: center; color: #64748B;">Loading service details...</p>
      </div>
    </div>
  </section>

  <!-- Shared Footer -->
  <div id="site-footer"></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/main.js"></script>
      <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('s');
      const container = document.getElementById('service-detail-container');
      if (!container) return;

      const s = typeof getServiceBySlug === 'function' ? getServiceBySlug(slug) : null;
      if (!s) {
        container.innerHTML = '<p>Service not found. <a href="services.html">Back to Services</a></p>';
        return;
      }
      document.title = s.title + ' | Koshti & Company';
      const badge = document.getElementById('srv-category-badge');
      const title = document.getElementById('srv-title');
      if (badge) badge.textContent = s.category || 'Service';
      if (title) title.textContent = s.title;

      const docs = (s.documents_required || []).map(d => '<li>' + d + '</li>').join('');
      const steps = (s.process_steps || []).map((st, i) => '<li><strong>Step ' + (i+1) + ':</strong> ' + st + '</li>').join('');

      container.innerHTML = `
        <p style="font-size:1.05rem; margin-bottom:1.5rem;">${s.full_desc || s.short_desc}</p>
        <h3 style="margin-bottom:0.75rem;">Who Needs This</h3>
        <p style="margin-bottom:1.5rem;">${s.who_needs_it || ''}</p>
        <h3 style="margin-bottom:0.75rem;">Documents Required</h3>
        <ul style="margin-bottom:1.5rem; padding-left:1.25rem;">${docs}</ul>
        <h3 style="margin-bottom:0.75rem;">Process</h3>
        <ol style="margin-bottom:2rem; padding-left:1.25rem;">${steps}</ol>
        <a href="contact.html?subject=${encodeURIComponent(s.title)}" class="btn btn-primary">Contact Us Regarding ${s.title}</a>
      `;
    });
  </script>
</body>
</html>
